name: Software Composition Analysis

on:
  push:
    branches: [dev-keeper]
  pull_request:
    branches: [dev-keeper]

jobs:
  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Install Snyk
        run: npm install -g snyk

      - name: Run Snyk and Print Results
        run: snyk test
