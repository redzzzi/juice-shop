name: Software Composition Analysis

on:
  push:
    branches: [dev-keeper]
  pull_request:
    branches: [dev-keeper]

jobs:
  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Snyk
        run: npm install -g snyk

      - name: Run Snyk and Save Report 
        run: snyk test
